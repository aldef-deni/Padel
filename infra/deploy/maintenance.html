<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Padel Replay · Sedang tidak aktif</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #f2fff8;
      background: radial-gradient(ellipse at 50% 20%, #0b5a3a 0%, #032418 55%, #01140d 100%);
    }
    main { max-width: 440px; text-align: center; }
    .mark {
      width: 88px; height: 88px; margin: 0 auto 28px; border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #a6ffd0, #2bea8a 45%, #0fb36b);
      box-shadow: 0 0 60px rgba(43, 234, 138, .45);
    }
    .mark svg { width: 44px; height: 44px; }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: .3em; color: #2bea8a; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: 28px; line-height: 1.2; letter-spacing: -.02em; }
    p { margin: 0; color: rgba(226, 255, 240, .65); line-height: 1.6; }
    footer { margin-top: 36px; font-size: 12px; color: rgba(226, 255, 240, .35); }
    a { color: #2bea8a; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#022015" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M10 9l5 3-5 3z" fill="#022015"/>
      </svg>
    </div>
    <div class="kicker">Padel Replay</div>
    <h1>Sedang tidak aktif sementara</h1>
    <p>Layanan ini sedang dinonaktifkan untuk pemeliharaan. Silakan kembali lagi nanti.</p>
    <footer>© Aldef Tech · <a href="https://aldeftech.com">aldeftech.com</a></footer>
  </main>
</body>
</html>
