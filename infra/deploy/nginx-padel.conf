# padel.aldeftech.com — Padel Replay (web + API + media), TLS dari Let's Encrypt.
# Meniru proxy di apps/web/vite.config.ts.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream padel_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP: hanya verifikasi Let's Encrypt (perpanjangan) + redirect ke HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name padel.aldeftech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name padel.aldeftech.com;

    ssl_certificate     /etc/letsencrypt/live/padel.aldeftech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/padel.aldeftech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:padel_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Situs nonaktif (`padel-site off prod`): selama file penanda ada, semua request mendapat
    # halaman "sedang tidak aktif" (503). Tidak perlu reload nginx untuk menyalakan/mematikan.
    error_page 503 /__maintenance.html;
    location = /__maintenance.html {
        alias /opt/padel/infra/deploy/maintenance.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3600" always;
    }
    # The error page itself must not be caught again (internal redirects re-run these checks).
    set $padel_off 0;
    if (-f /opt/padel/data/maintenance/prod) {
        set $padel_off 1;
    }
    if ($uri = /__maintenance.html) {
        set $padel_off 0;
    }
    if ($padel_off) {
        return 503;
    }

    # Proxy: header umum ke backend.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Web (build Vite). SPA: route tak dikenal -> index.html.
    root /opt/padel/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html selalu dicek ulang agar deploy baru langsung terpakai.
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Aset ber-hash dari Vite: aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # API NestJS (+ upload logo maks. 1 MB, unduh klip dengan Range).
    location /api/ {
        proxy_pass http://padel_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 2m;
    }

    # Swagger UI.
    location /docs {
        proxy_pass http://padel_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Socket.IO (notifikasi klip, layar TV).
    location /socket.io/ {
        proxy_pass http://padel_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # File unduhan (APK aplikasi pemain untuk testing, zip source), di luar folder build web.
    location /downloads/ {
        alias /opt/padel/data/downloads/;
        types { application/vnd.android.package-archive apk; application/zip zip; }
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # MediaMTX HLS (hanya localhost). Location absolut ("/court-1/...") diberi prefix lagi.
    location /media/hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_redirect / /media/hls/;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # MediaMTX WebRTC: sinyal WHEP (media tetap lewat UDP 8189 langsung).
    location /media/webrtc/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_redirect / /media/webrtc/;
        proxy_buffering off;
    }
}
